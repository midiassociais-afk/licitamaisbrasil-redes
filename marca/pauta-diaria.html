<title>Central de Publicações Licita Mais Brasil</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: mesa de aprovação — abas de dia no topo; cada sugestão em duas colunas: texto e decisão à esquerda, prévia por rede à direita */
:root{
  --verde:#21B24D;--azul:#03A2E4;--amarelo:#FFC718;--grafite:#28323B;
  --bg:#F4F6F8;--card:#FFFFFF;--fg:#28323B;--muted:#55636E;--line:#E4E9ED;--accent:#157A35;--accent2:#0270A6;--focus:#0270A6;
  --ok-bg:#DDF5E4;--ok-fg:#0F6B34;--warn-bg:#FFF1C2;--warn-fg:#6B5200;--bad-bg:#FDE2E0;--bad-fg:#8A1F17;--idle-bg:#E9EEF2;--idle-fg:#55636E;
  --mock-bg:#FFFFFF;--mock-fg:#0F1419;--mock-muted:#65676B;--mock-line:#E4E6EB;
  --f-tit:'Poppins',Arial,sans-serif;--f-txt:'Inter',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181D;--card:#1B232A;--fg:#E8EDF1;--muted:#A3B0BA;--line:#2C3740;--accent:#4FD27A;--accent2:#4CC3F5;--focus:#4CC3F5;
  --ok-bg:#163A24;--ok-fg:#7BE3A0;--warn-bg:#3A3214;--warn-fg:#FFD866;--bad-bg:#3D1C1A;--bad-fg:#FF9A90;--idle-bg:#26303A;--idle-fg:#A3B0BA;
  --mock-bg:#000000;--mock-fg:#E7E9EA;--mock-muted:#8B98A5;--mock-line:#2F3336;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181D;--card:#1B232A;--fg:#E8EDF1;--muted:#A3B0BA;--line:#2C3740;--accent:#4FD27A;--accent2:#4CC3F5;--focus:#4CC3F5;
  --ok-bg:#163A24;--ok-fg:#7BE3A0;--warn-bg:#3A3214;--warn-fg:#FFD866;--bad-bg:#3D1C1A;--bad-fg:#FF9A90;--idle-bg:#26303A;--idle-fg:#A3B0BA;
  --mock-bg:#000000;--mock-fg:#E7E9EA;--mock-muted:#8B98A5;--mock-line:#2F3336;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-txt);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-tit);margin:0;letter-spacing:-.01em;text-wrap:balance;line-height:1.2}
button{font:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.faixa{height:6px;background:linear-gradient(90deg,var(--verde) 0 40%,var(--azul) 40% 60%,var(--amarelo) 60% 100%)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line)}
.brand h1{font-size:18px;font-weight:800}
.days{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding-bottom:2px}
.day{font:600 13px var(--f-tit);border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.day[aria-pressed="true"]{background:var(--grafite);color:#fff;border-color:var(--grafite)}
main{padding-block:22px 80px;display:grid;gap:18px}
.summary{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px}
.kick{font:600 12px var(--f-tit);letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}
.summary h2{font-size:22px;font-weight:800}
.summary p{margin:0;color:var(--muted);max-width:76ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fonte{font-size:12.5px;border-radius:999px;padding:3px 10px;background:var(--idle-bg);color:var(--idle-fg)}
.fonte.ok::before{content:"● ";color:var(--verde)}
.fonte.falha{background:var(--bad-bg);color:var(--bad-fg)}
.fonte.falha::before{content:"● "}
.pill{font:600 12px var(--f-tit);border-radius:999px;padding:4px 11px;white-space:nowrap;border:0}
.st-pendente{background:var(--idle-bg);color:var(--idle-fg)}
.st-aprovado{background:var(--ok-bg);color:var(--ok-fg)}
.st-ajustar{background:var(--warn-bg);color:var(--warn-fg)}
.st-descartado{background:var(--bad-bg);color:var(--bad-fg)}
button.pill{cursor:pointer;opacity:.6}
button.pill[aria-pressed="true"]{opacity:1;box-shadow:inset 0 0 0 2px currentColor}
.list{display:grid;gap:16px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;display:grid;grid-template-columns:8px minmax(0,1fr);overflow:hidden}
.item .stripe{background:var(--c,#999)}
.item .inner{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;padding:18px 20px}
@media (max-width:900px){.item .inner{grid-template-columns:minmax(0,1fr)}}
.item.descartado .left{opacity:.55}
.left{display:grid;gap:10px;align-content:start;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.linha{font:700 12px var(--f-tit);letter-spacing:.06em;text-transform:uppercase}
.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:var(--muted)}
.prio{font:600 12px var(--f-txt);color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.item h3{font-size:19px;font-weight:700}
.gancho{color:var(--muted);margin:0}
.note{font-size:13.5px;color:var(--muted)}
.alerta{font-size:13.5px;background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:8px 12px;white-space:pre-wrap}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font:600 13px var(--f-tit);color:var(--accent2)}
ol.slides{margin:8px 0 0;padding-left:22px;display:grid;gap:8px;font-size:14px}
ol.slides li{white-space:pre-wrap}
.lbl{font:600 12px var(--f-tit);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:block;margin-top:8px}
textarea{width:100%;min-height:110px;font:14px/1.5 var(--f-txt);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical;margin-top:4px}
.src{display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.src a{color:var(--accent2);overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:600 13.5px var(--f-tit);border-radius:10px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.btn.aprovar{background:#21B24D;border-color:#21B24D;color:#0B2E17}
.btn.ajustar{background:var(--amarelo);border-color:var(--amarelo);color:#28323B}
.btn:disabled{opacity:.5;cursor:default}
.erro{font-size:13px;background:var(--bad-bg);color:var(--bad-fg);border-radius:8px;padding:6px 10px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted);display:grid;gap:6px}
.empty b{font-family:var(--f-tit);color:var(--fg);font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--grafite);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
/* ===== prévias ===== */
.prev{display:grid;gap:10px;align-content:start;min-width:0}
.nets{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:4px}
.net{flex:1;font:600 12.5px var(--f-tit);border:0;background:transparent;color:var(--muted);border-radius:7px;padding:6px 4px;cursor:pointer}
.net[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mock{background:var(--mock-bg);color:var(--mock-fg);border:1px solid var(--mock-line);border-radius:12px;overflow:hidden;font:14px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.mh{display:flex;align-items:center;gap:9px;padding:10px 12px}
.mh img{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--mock-line);flex:none}
.mh b{font-weight:600;font-size:13.5px}
.mh small{display:block;color:var(--mock-muted);font-size:12px}
.mtxt{padding:0 12px 10px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px}
.mtxt.cut{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mais{background:none;border:0;color:var(--mock-muted);cursor:pointer;padding:0 12px 10px;font-size:13px}
.media{position:relative;background:#000;aspect-ratio:4/5}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.media.x{aspect-ratio:auto;margin:0 12px 10px;border-radius:14px;overflow:hidden;border:1px solid var(--mock-line)}
.media.x img{max-height:420px}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#222;cursor:pointer;font-size:16px;line-height:30px;padding:0}
.nav.p{left:8px}.nav.n{right:8px}
.count{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;border-radius:999px;padding:2px 9px}
.dots{display:flex;justify-content:center;gap:4px;padding:8px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--mock-line)}
.dots i.on{background:#0095F6}
.icons{display:flex;gap:14px;padding:4px 12px 6px;color:var(--mock-fg)}
.icons svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.lipager{background:rgba(0,0,0,.7);color:#fff;font-size:12px;text-align:center;padding:4px}
.placeholder{aspect-ratio:4/5;display:grid;place-content:center;gap:10px;padding:26px;text-align:left;color:#fff;background:var(--c,#28323B)}
.placeholder b{font:800 22px/1.15 var(--f-tit)}
.placeholder span{font-size:12.5px;opacity:.85}
.xfoot{display:flex;justify-content:space-between;padding:0 12px 10px;color:var(--mock-muted);font-size:12.5px}
.xfoot .over{color:#F4212E;font-weight:700}
.ytnote{padding:14px;font-size:13.5px;color:var(--mock-muted)}
/* ===== identidade ===== */
.kit{display:grid;gap:16px}
.kitcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.kitcard h3{font-size:18px}
.kitgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.kitimg{width:100%;border-radius:10px;border:1px solid var(--line);display:block;background:#fff}
.hl{display:flex;gap:14px;flex-wrap:wrap}
.hl figure{margin:0;display:grid;justify-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.hl .circ{width:76px;height:76px;border-radius:50%;overflow:hidden;border:2px solid var(--line)}
.hl .circ img{width:100%;height:100%;object-fit:cover}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.check input{width:20px;height:20px;accent-color:#21B24D}
ol.passos{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px;color:var(--muted)}
.arq{font-size:12.5px;color:var(--muted);font-family:ui-monospace,Consolas,monospace;overflow-wrap:anywhere}
/* ===== semana ===== */
.semana{display:grid;gap:16px}
.semnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.semnav h3{font-size:17px}
.dias5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:980px){.dias5{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}}
.slot{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;min-width:0}
.slot.hoje{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2)}
.slot .topo{padding:10px 12px;border-bottom:4px solid var(--c,#999);display:grid;gap:2px}
.slot .topo b{font:700 14px var(--f-tit);text-transform:capitalize}
.slot .topo span{font-size:12px;color:var(--muted)}
.slot .conteudo{padding:12px;display:grid;gap:8px;align-content:start;min-width:0}
.thumb{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;background:var(--bg);display:block}
.thumbph{aspect-ratio:4/5;border-radius:8px;background:var(--c,#28323B);color:#fff;display:grid;place-content:center;padding:12px;font:700 14px/1.2 var(--f-tit);text-align:center}
.slot h4{font:600 14px/1.3 var(--f-tit);margin:0;overflow-wrap:anywhere}
.vazio{border:1px dashed var(--line);border-radius:8px;padding:14px;color:var(--muted);font-size:13px;display:grid;gap:8px}
select{font:13px var(--f-txt);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%;max-width:100%}
.btn.mini{padding:5px 10px;font-size:12.5px}
.crono{display:grid;gap:4px;font-size:13.5px}
.crono .lin{display:grid;grid-template-columns:90px 1fr;gap:8px}
.crono .lin b{font-family:var(--f-tit);font-weight:600}
.agenda{font-size:13px;font-weight:600;color:var(--accent2)}
</style>

<header>
  <div class="faixa"></div>
  <div class="wrap">
    <div class="brand"><img src="logos/simbolo_colorido.png" alt=""><h1>Central de publicações</h1></div>
    <div class="days" id="days" role="group" aria-label="Escolher pauta"></div>
  </div>
</header>

<main class="wrap">
  <section class="summary" id="summary">
    <span class="kick">Licita Mais Brasil · Instagram, Facebook, LinkedIn, X e YouTube</span>
    <h2 id="sumTitle">Carregando…</h2>
    <p id="sumText">A coleta automática roda todo dia às 6h. Confira a prévia de cada rede e aprove o que pode ser publicado.</p>
    <div class="row" id="counts"></div>
    <div class="row" id="fontes"></div>
  </section>
  <div class="row" id="filters" role="group" aria-label="Filtrar por situação"></div>
  <div class="list" id="list"></div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
const LINHAS={
  jurisprudencia:{nome:'Jurisprudência TCU',cor:'#28323B'},
  oportunidade:{nome:'Oportunidades',cor:'#21B24D'},
  novidade:{nome:'Novidade da plataforma',cor:'#0270A6'},
  legislacao:{nome:'Legislação e dicas',cor:'#E0A800'},
  institucional:{nome:'Institucional',cor:'#0F6B34'},
  noticia:{nome:'Notícias do setor',cor:'#03A2E4'}
};
const STATUS={pendente:'Pendente',aprovado:'Aprovado',ajustar:'Ajustar',descartado:'Descartado'};
// Cronograma: uma publicação por dia útil. Horários pelo pico de público medido no Metricool (out/2026).
const CRONOGRAMA=[
  {dia:1,nome:'segunda',linha:'legislacao',tema:'Legislação e dicas'},
  {dia:2,nome:'terça',linha:'jurisprudencia',tema:'Jurisprudência do TCU'},
  {dia:3,nome:'quarta',linha:'oportunidade',tema:'Oportunidades da semana'},
  {dia:4,nome:'quinta',linha:'novidade',tema:'Novidade da plataforma ou "Você sabia?"'},
  {dia:5,nome:'sexta',linha:'noticia',tema:'Destaque da semana'}
];
const HORARIOS='LinkedIn e X às 11h · Instagram e Facebook às 18h30';
// Envio ao Metricool (conector do próprio visitante). Cada grupo vira um post no Metricool, no horário de pico da rede.
const MC='Metricool Social Media Management',MC_BLOG='7650942',TZ='America/Sao_Paulo';
const RAW='https://raw.githubusercontent.com/midiassociais-afk/licitamaisbrasil-redes/main/marca/saida/';
const MC_REDES=[{id:'instagram',nome:'Instagram',hora:'18:30'},{id:'facebook',nome:'Facebook',hora:'18:30'},{id:'linkedin',nome:'LinkedIn',hora:'11:00'},{id:'twitter',nome:'X',hora:'11:00'}];
let mcp=null;const mcState={};
// Ajuste imediato: o Claude da conta de quem aprova reescreve o texto; a arte é refeita pela tarefa de ajustes (de hora em hora)
let sampleFn=null;const ajState={};
const AJ_HORARIO='em até 1 hora (dias úteis, das 8h às 18h)';
const AVATAR='logos/simbolo_colorido.png';
const KIT=[
  {rede:'instagram',nome:'Instagram',arquivos:['Perfil_Todas_as_Redes_1080x1080.png'],destaques:true,passos:['No app, abra o perfil e toque em Editar perfil › Editar foto.','Envie Perfil_Todas_as_Redes_1080x1080.png.','Para cada destaque: toque e segure › Editar destaque › Editar capa › escolha o arquivo Destaque_….png correspondente.','Crie o destaque "Oportunidades" com a capa Destaque_Oportunidades.png.']},
  {rede:'facebook',nome:'Facebook',arquivos:['Perfil_Todas_as_Redes_1080x1080.png','Facebook_Capa_1640x624.png'],passos:['Na página, clique na foto de perfil › Atualizar foto do perfil.','Clique em Editar foto da capa › Carregar foto › Facebook_Capa_1640x624.png.','Arraste para centralizar, se necessário, e salve.']},
  {rede:'linkedin',nome:'LinkedIn',arquivos:['Perfil_Todas_as_Redes_1080x1080.png','LinkedIn_Capa_1128x191.png'],passos:['Entre como administrador da página › Editar página.','Em Cabeçalho, envie o logotipo (Perfil_…) e a imagem de capa (LinkedIn_Capa_1128x191.png).','Salve.']},
  {rede:'youtube',nome:'YouTube',arquivos:['Perfil_Todas_as_Redes_1080x1080.png','YouTube_Banner_2560x1440.png'],passos:['Abra o YouTube Studio › Personalização › Branding.','Imagem do perfil: Perfil_…; Imagem do banner: YouTube_Banner_2560x1440.png.','Publicar.']},
  {rede:'x',nome:'X',arquivos:['Perfil_Todas_as_Redes_1080x1080.png','X_Capa_1500x500.png'],passos:['No perfil @licitamaisbr, clique em Editar perfil.','Troque a foto (Perfil_…) e o cabeçalho (X_Capa_1500x500.png).','Salvar.']}
];
const DESTAQUES=[['Jurisprudência','Destaque_Jurisprudencia.png'],['Legislação','Destaque_Legislacao.png'],['Ferramentas','Destaque_Ferramentas.png'],['A Plataforma','Destaque_Plataforma.png'],['Perguntas','Destaque_Perguntas.png'],['Oportunidades','Destaque_Oportunidades.png']];

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDia=d=>{if(d==='semana')return'Semana';if(d==='reedicao')return'Reedição';if(d==='identidade')return'Identidade';if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return d;const[y,m,dd]=d.split('-');return new Date(+y,+m-1,+dd).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})};
let db=null,me=null,canWrite=true,dia=null,pautas=[],itens=[],kitDocs={},unsubItens=null;
let semanaIni=segundaDe(new Date()),semanaItens=[],pool=[],unsubSemana=[],irPara=null;
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function segundaDe(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=x.getDay();x.setDate(x.getDate()+(w===0?1:w===6?2:1-w));return x}
function diasDaSemana(){return CRONOGRAMA.map((c,k)=>{const d=new Date(semanaIni);d.setDate(d.getDate()+k);return{...c,data:iso(d),obj:d}})}
const filtro=new Set(['pendente','ajustar','aprovado']);
const prevState={};   // por item: {net, slide}
const erros={};       // por item: última mensagem de erro de gravação
const salvando=new Set();
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,3200)}
const msgErro=e=>{const c=e&&e.code;return c==='invalid_argument'?'O servidor recusou a gravação (sem permissão de escrita ou dado inválido).':c==='unavailable'?'Conexão instável. Tente de novo em alguns segundos.':c==='resource_exhausted'?'Muitas gravações seguidas. Aguarde um instante.':c==='revoked'?'O acesso a esta página mudou. Recarregue.':'Não foi possível gravar'+(c?` (código: ${c})`:'')+'.'};

/* ---------- topo e resumo ---------- */
function renderDays(){
  const box=$('days');box.innerHTML='';
  ['semana',...pautas.map(p=>p.id),'identidade'].forEach(id=>{const b=document.createElement('button');b.className='day';b.textContent=fmtDia(id);
    b.setAttribute('aria-pressed',id===dia?'true':'false');b.onclick=()=>selectDia(id);box.appendChild(b)});
}
function renderSummary(){
  if(dia==='semana'){$('sumTitle').textContent='Cronograma da semana';
    $('sumText').textContent='Uma publicação por dia, de segunda a sexta, a mesma em todas as redes. '+HORARIOS+'. Encaixe uma sugestão em cada dia e aprove; o que estiver aprovado no dia é o que sai.';
    const ds=diasDaSemana();const aprov=ds.filter(d=>semanaItens.some(i=>i.dataPublicacao===d.data&&i.status==='aprovado')).length;const ocup=ds.filter(d=>semanaItens.some(i=>i.dataPublicacao===d.data)).length;
    $('counts').innerHTML=`<span class="pill ${aprov===5?'st-aprovado':'st-pendente'}">${aprov} de 5 dias aprovados</span><span class="pill st-pendente">${5-ocup} dia(s) sem post</span><span class="pill st-ajustar">${pool.length} sugestão(ões) sem dia</span>`;
    $('fontes').innerHTML='';$('filters').hidden=true;return}
  if(dia==='identidade'){$('sumTitle').textContent='Identidade visual das redes';
    $('sumText').textContent='Foto de perfil, capas e capas de destaques no padrão novo. As redes não permitem trocar esses itens por integração, então cada rede é atualizada à mão. Marque cada uma depois de aplicar.';
    const feitas=KIT.filter(k=>kitDocs[k.rede]?.aplicado).length;
    $('counts').innerHTML=`<span class="pill ${feitas===KIT.length?'st-aprovado':'st-pendente'}">${feitas} de ${KIT.length} redes atualizadas</span>`;$('fontes').innerHTML='';$('filters').hidden=true;return}
  $('filters').hidden=false;
  const p=pautas.find(x=>x.id===dia);
  if(!p){$('sumTitle').textContent=pautas.length?'Escolha uma pauta':'Nenhuma pauta ainda';
    $('sumText').textContent='A primeira pauta aparece aqui depois da coleta das 6h.';$('counts').innerHTML='';$('fontes').innerHTML='';return}
  $('sumTitle').textContent=p.titulo||('Pauta de '+fmtDia(p.id));
  $('sumText').textContent=p.resumo||'';
  const c={pendente:0,aprovado:0,ajustar:0,descartado:0};itens.forEach(i=>c[i.status||'pendente']++);
  $('counts').innerHTML=Object.keys(c).map(k=>`<span class="pill st-${k}">${c[k]} ${STATUS[k].toLowerCase()}</span>`).join('');
  $('fontes').innerHTML=(p.fontes||[]).map(f=>`<span class="fonte ${f.ok?'ok':'falha'}" title="${esc(f.nota||'')}">${esc(f.nome)}${f.ok?'':' · falhou'}</span>`).join('');
}
function renderFilters(){
  $('filters').innerHTML='';
  Object.keys(STATUS).forEach(k=>{const b=document.createElement('button');b.className='pill st-'+k;b.textContent=STATUS[k];
    b.setAttribute('aria-pressed',filtro.has(k)?'true':'false');
    b.onclick=()=>{filtro.has(k)?filtro.delete(k):filtro.add(k);renderFilters();renderList()};$('filters').appendChild(b)});
}

/* ---------- prévias ---------- */
function redesDo(i){
  const f=(i.formatos||[]).join(' ');const r=['instagram','facebook'];
  if(/LinkedIn/i.test(f))r.push('linkedin');
  if(i.textoX!=null||/\bX\b/.test(f))r.push('x');
  if(/YouTube|Short/i.test(f))r.push('youtube');
  return r;
}
const NOMES={instagram:'Instagram',facebook:'Facebook',linkedin:'LinkedIn',x:'X',youtube:'YouTube'};
const ICON={coracao:'<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
  balao:'<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3.3-6.5L20 4l-.8 4A8 8 0 0 1 20 12z"/></svg>',
  enviar:'<svg viewBox="0 0 24 24"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"/></svg>',
  salvar:'<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>'};
function midia(i,st,tipo){
  const imgs=i.imagens||[];
  if(!imgs.length){const L=LINHAS[i.linha]||{cor:'#28323B'};return `<div class="placeholder" style="--c:${L.cor}"><b>${esc(i.titulo)}</b><span>A arte é gerada depois da aprovação do texto.</span></div>`}
  const n=Math.min(st.slide,imgs.length-1);
  const nav=imgs.length>1?`${n>0?`<button class="nav p" data-act="slide" data-d="-1" data-id="${esc(i.id)}" aria-label="Tela anterior">‹</button>`:''}${n<imgs.length-1?`<button class="nav n" data-act="slide" data-d="1" data-id="${esc(i.id)}" aria-label="Próxima tela">›</button>`:''}`:'';
  if(tipo==='x')return `<div class="media x"><img src="${esc(imgs[0])}" alt="Imagem do post"></div>`;
  return `<div class="media"><img src="${esc(imgs[n])}" alt="Tela ${n+1} de ${imgs.length}" loading="lazy">${nav}${imgs.length>1&&tipo!=='li'?`<span class="count">${n+1}/${imgs.length}</span>`:''}</div>${tipo==='li'&&imgs.length>1?`<div class="lipager">${n+1} / ${imgs.length} · documento</div>`:''}${tipo==='ig'&&imgs.length>1?`<div class="dots">${imgs.map((_,k)=>`<i class="${k===n?'on':''}"></i>`).join('')}</div>`:''}`;
}
function textoMock(id,txt){const longo=(txt||'').length>140||(txt||'').split('\n').length>3;
  return `<div class="mtxt ${longo&&!prevState[id].aberto?'cut':''}">${esc(txt)}</div>${longo?`<button class="mais" data-act="mais" data-id="${esc(id)}">${prevState[id].aberto?'ver menos':'… ver mais'}</button>`:''}`}
function previa(i){

  if(!redes.includes(st.net))st.net=redes[0];

    <div class="icons">${ICON.coracao}${ICON.balao}${ICON.enviar}<span style="margin-left:auto">${ICON.salvar}</span></div>${textoMock(i.id,leg?('licitamaisbrasil '+leg):'(legenda vazia)')}</div>`;
  else if(st.net==='facebook')corpo=`<div class="mock"><div class="mh"><img src="${AVATAR}" alt=""><div><b>Licita Mais Brasil</b><small>Agora · Público</small></div></div>${textoMock(i.id,leg||'(legenda vazia)')}${midia(i,st,'fb')}</div>`;
  else if(st.net==='linkedin')corpo=`<div class="mock"><div class="mh"><img src="${AVATAR}" alt=""><div><b>Licita Mais Brasil</b><small>Página · Agora</small></div></div>${textoMock(i.id,leg||'(legenda vazia)')}${midia(i,st,'li')}</div>`;
  else if(st.net==='x'){const n=[...tx].length;corpo=`<div class="mock"><div class="mh"><img src="${AVATAR}" alt=""><div><b>Licita Mais Brasil</b><small>@licitamaisbr · agora</small></div></div>
    <div class="mtxt">${esc(tx||'(texto para o X vazio)')}</div>${midia(i,st,'x')}<div class="xfoot"><span>Prévia do X</span><span class="${n>280?'over':''}">${n}/280</span></div></div>`}
  else corpo=`<div class="mock"><div class="mh"><img src="${AVATAR}" alt=""><div><b>Licita Mais Brasil</b><small>YouTube</small></div></div><div class="ytnote">Vídeo: o roteiro está na coluna ao lado. A prévia aparece quando o vídeo for editado.</div></div>`;
  return `<div class="prev"><div class="nets" role="tablist" aria-label="Prévia por rede">${redes.map(r=>`<button class="net" role="tab" aria-selected="${r===st.net}" data-act="net" data-net="${r}" data-id="${esc(i.id)}">${NOMES[r]}</button>`).join('')}</div>${corpo}</div>`;

/* ---------- ajuste imediato ---------- */
function promptAjuste(i,pedido){
  const atual={titulo:i.titulo,gancho:i.gancho||'',baseLegal:i.baseLegal||'',linha:i.linha,slides:i.slides||[],telas:i.telas||null,legenda:i.legenda||'',textoX:i.textoX??null};
  return `Você edita posts das redes sociais da Licita Mais Brasil (plataforma de licitações eletrônicas). Aplique SOMENTE o pedido de ajuste abaixo ao post atual. Não mude o que o pedido não pede. Não invente fatos, números, datas nem artigos de lei; mantenha as citações legais que já existem. Português do Brasil, frases curtas, voz ativa, "Licita Mais Brasil" por extenso.

PEDIDO DE AJUSTE:
${pedido}

POST ATUAL (JSON):
${JSON.stringify(atual)}

Regras do campo "telas" (uma tela por imagem):
- {"tipo":"capa","kicker":"…","titulo":"até 70 caracteres","sub":"até 90"}: sempre a primeira
- {"tipo":"texto","kicker":"…","titulo":"até 50","texto":"até 220","destaque":"opcional"}
- {"tipo":"lista","kicker":"…","titulo":"até 50","itens":["2 a 4 itens de até 70"],"destaque":"opcional"}
- {"tipo":"oport","modalidade":"…","objeto":"até 60","orgao":"…","abertura":"…","processo":"…","link":"…"}
- {"tipo":"cta","titulo":"…","texto":"…","url":"licitamaisbrasil.com.br"}: sempre a última de um carrossel
Se "telas" vier null, monte as telas a partir de "slides" (uma tela por slide, mesmo texto). "slides" é o texto corrido das telas, um por tela, com o título na primeira linha; mantenha "slides" e "telas" coerentes.
"textoX": até 270 caracteres, sem emojis; se vier null, devolva null.

Responda só com um objeto JSON:
{"titulo":"…","slides":["…"],"telas":[…],"legenda":"…","textoX":"…","mudouArte":true,"resumo":"uma frase dizendo o que mudou"}
"mudouArte" é true quando algum texto que aparece nas imagens (telas) mudou.`;
}
function propostaAjuste(i){
  const p=ajState[i.id].proposta,id=esc(i.id);
  const mud=(a,b)=>JSON.stringify(a??null)!==JSON.stringify(b??null);
  return `<div class="kitcard" style="padding:14px;gap:10px;border-color:var(--accent)">
    <b style="font-family:var(--f-tit)">Proposta de ajuste</b>
    <p class="note" style="margin:0">${esc(p.resumo||'')}</p>
    ${mud(p.titulo,i.titulo)?`<div><span class="lbl">Título</span><div>${esc(p.titulo)}</div></div>`:''}
    ${mud(p.slides,i.slides)?`<div><span class="lbl">Telas</span><ol class="slides">${(p.slides||[]).map((s,k)=>`<li${(i.slides||[])[k]!==s?' style="background:var(--warn-bg);border-radius:6px;padding:2px 6px"':''}>${esc(s)}</li>`).join('')}</ol></div>`:''}
    ${mud(p.legenda,i.legenda)?`<div><span class="lbl">Legenda</span><p class="note" style="white-space:pre-wrap;margin:0">${esc(p.legenda)}</p></div>`:''}
    ${p.textoX!=null&&mud(p.textoX,i.textoX)?`<div><span class="lbl">Texto do X · ${[...p.textoX].length}/280</span><p class="note" style="margin:0">${esc(p.textoX)}</p></div>`:''}
    ${p.mudouArte&&(i.imagens||[]).length?`<div class="note">A arte será refeita ${AJ_HORARIO} depois de aplicar.</div>`:''}
    ${i.metricool?'<div class="alerta">Este post já foi enviado ao Metricool. Depois do ajuste, apague o post antigo lá e envie de novo.</div>':''}
    <div class="actions"><button class="btn aprovar" data-act="aj-aplicar" data-id="${id}">Aplicar ajuste</button><button class="btn" data-act="aj-descartar" data-id="${id}">Descartar proposta</button></div>
  </div>`;
}
const msgSample=e=>{const c=e&&e.code;
  if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared')return 'O Claude não está liberado para esta página. Use "Deixar para a tarefa".';
  if(c==='rate_limited')return 'Limite de uso do Claude atingido agora. Tente mais tarde ou use "Deixar para a tarefa".';
  if(c==='invalid_json'||c==='empty_completion')return 'A resposta veio incompleta. Tente de novo, talvez com um pedido mais curto.';
  if(c==='refused')return 'O Claude não aceitou esse pedido. Reformule o pedido.';
  if(c==='session_expired')return 'Sua sessão expirou. Entre de novo no claude.ai.';
  return 'Não foi possível reescrever agora ('+(c||'erro')+'). Tente de novo ou use "Deixar para a tarefa".'};
async function ajustarAgora(i){
  const s=ajState[i.id]||(ajState[i.id]={});s.aberto=true;
  const pedido=($('cm-'+i.id)?.value||'').trim();s.pedido=pedido;
  if(!pedido){s.erro='Escreva o que precisa mudar.';renderList();return}
  s.carregando=true;s.erro='';s.proposta=null;renderList();
  try{
    const r=await sampleFn.json(promptAjuste(i,pedido),{modelTier:'default',cache:false});
    if(!r||typeof r!=='object'||!Array.isArray(r.slides)||!Array.isArray(r.telas)||!r.telas.length||!r.telas.every(t=>t&&t.tipo))throw{code:'invalid_json'};
    s.proposta=r;
  }catch(e){s.erro=msgSample(e)}
  s.carregando=false;renderList();
}
async function aplicarAjuste(i){
  const s=ajState[i.id],p=s.proposta;
  const dados={titulo:String(p.titulo||i.titulo),slides:p.slides.map(String),telas:p.telas,legenda:String(p.legenda||''),
    status:'pendente',comentario:'',comentarioAtendido:s.pedido,ajustadoEm:new Date().toISOString(),decididoEm:new Date().toISOString(),decididoPor:me||''};
  if(p.textoX!=null)dados.textoX=String(p.textoX);
  if(p.mudouArte&&(i.imagens||[]).length)dados.artePendente=true;
  if(await gravar(i.id,dados,'Ajuste aplicado. Confira e aprove de novo.')){delete ajState[i.id];if(mcState[i.id])delete mcState[i.id];renderList()}
}

/* ---------- envio ao Metricool ---------- */
const publicas=i=>(i.imagensPublicas&&i.imagensPublicas.length)?i.imagensPublicas:(i.imagens||[]).map(p=>RAW+p);
function proximoDiaUtil(){const d=new Date();d.setDate(d.getDate()+1);while([0,6].includes(d.getDay()))d.setDate(d.getDate()+1);return iso(d)}
function estadoMc(i){
  if(mcState[i.id])return mcState[i.id];
  const temImg=publicas(i).length>0,f=(i.formatos||[]).join(' ');
  const redes=new Set(['facebook']);if(temImg)redes.add('instagram');if(/LinkedIn/i.test(f))redes.add('linkedin');if(i.textoX)redes.add('twitter');
  const data=i.dataPublicacao&&i.dataPublicacao>=iso(new Date())?i.dataPublicacao:proximoDiaUtil();
  return mcState[i.id]={aberto:false,data,redes,modo:'rascunho',msg:'',erro:'',enviando:false};
}
function painelMetricool(i){
  const s=estadoMc(i),id=esc(i.id),temImg=publicas(i).length>0,env=i.metricool;
  const feito=env?`<div class="note"><b>${env.modo==='agendar'?'Agendado':'Rascunho criado'} no Metricool</b> em ${esc(new Date(env.enviadoEm).toLocaleString('pt-BR'))} para ${esc(fmtDia(env.data))}: ${esc((env.redes||[]).join(', '))}. Confira no <a href="https://app.metricool.com/planner" target="_blank" rel="noopener">planejador do Metricool</a>.</div>`:'';
  if(!s.aberto)return `${feito}<div class="actions"><button class="btn" data-act="mc-abrir" data-id="${id}">${env?'Enviar de novo ao Metricool':'Enviar ao Metricool'}</button></div>`;
  return `${feito}<div class="kitcard" style="padding:14px;gap:10px">
    <b style="font-family:var(--f-tit)">Enviar ao Metricool</b>
    <label class="lbl" for="mc-data-${id}">Dia da publicação</label><input type="date" id="mc-data-${id}" data-mc="data" data-id="${id}" value="${esc(s.data)}" min="${iso(new Date())}" style="font:14px var(--f-txt);padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)">
    <span class="lbl">Redes e horários</span>
    <div style="display:grid;gap:4px">${MC_REDES.map(r=>{const bloq=r.id==='instagram'&&!temImg||r.id==='twitter'&&!i.textoX;
      return `<label class="check" style="font-weight:500"><input type="checkbox" id="mc-${r.id}-${id}" data-mc="rede" data-rede="${r.id}" data-id="${id}" ${s.redes.has(r.id)&&!bloq?'checked':''} ${bloq?'disabled':''}> ${r.nome} às ${r.hora}${bloq?(r.id==='instagram'?' (precisa de imagem)':' (sem texto para o X)'):''}</label>`}).join('')}</div>
    <span class="lbl">Modo</span>
    <label class="check" style="font-weight:500"><input type="radio" name="mc-modo-${id}" id="mc-r-${id}" data-mc="modo" data-modo="rascunho" data-id="${id}" ${s.modo==='rascunho'?'checked':''}> Rascunho: fica no Metricool, nada é publicado (bom para testar)</label>
    <label class="check" style="font-weight:500"><input type="radio" name="mc-modo-${id}" id="mc-a-${id}" data-mc="modo" data-modo="agendar" data-id="${id}" ${s.modo==='agendar'?'checked':''}> Agendar: o Metricool publica sozinho no dia e hora acima</label>
    <div class="${s.modo==='agendar'?'alerta':'note'}" id="mc-resumo-${id}" style="font-size:14px">${resumoMc(s)}${s.modo==='agendar'?' O Metricool publica sozinho, sem nova confirmação.':''}</div>
    ${s.erro?`<div class="erro" role="alert">${esc(s.erro)}</div>`:''}${s.msg?`<div class="note">${s.msg}</div>`:''}
    <div class="actions"><button class="btn aprovar" data-act="mc-enviar" data-id="${id}" ${s.enviando||!mcp?'disabled':''}>${s.enviando?'Enviando…':(s.modo==='agendar'?'Agendar no Metricool':'Criar rascunho no Metricool')}</button><button class="btn" data-act="mc-fechar" data-id="${id}">Cancelar</button></div>
    ${!mcp?'<div class="note">O envio ao Metricool funciona com a página aberta no claude.ai, com o conector do Metricool ligado na sua conta.</div>':''}
  </div>`;
}
const msgMc=e=>{const c=e&&e.code;
  if(c==='server_not_connected'||c==='needs_reauth')return 'O Metricool não está conectado na sua conta do Claude. Conecte em claude.ai › Configurações › Conectores e tente de novo.';
  if(c==='not_in_manifest'||c==='approval_required'||c==='consent_required')return 'É preciso permitir que esta página use o Metricool. Clique em enviar de novo e aceite o pedido de permissão.';
  if(c==='selection_required')return 'Há mais de um conector do Metricool na sua conta. Escolha qual usar no aviso do claude.ai.';
  if(c==='tool_error'){const t=(e.result&&e.result.content||[]).map(b=>b.text).filter(Boolean).join(' ')||e.message;return 'O Metricool recusou o post: '+t}
  if(c==='server_unavailable'||c==='upstream_error'||c==='cancelled')return 'O Metricool não respondeu a tempo. O post pode ter sido criado: confira no planejador do Metricool antes de enviar de novo.';
  return 'Não foi possível enviar ('+(c||'erro')+').'};
// Lê o que está na tela neste momento (data, redes e modo), para o envio nunca usar um valor antigo
function lerCamposMc(i){
  const s=estadoMc(i),dt=$('mc-data-'+i.id);
  if(dt&&dt.value)s.data=dt.value;
  const marcadas=MC_REDES.filter(r=>{const c=$(`mc-${r.id}-${i.id}`);return c&&c.checked&&!c.disabled}).map(r=>r.id);
  if(document.getElementById(`mc-${MC_REDES[0].id}-${i.id}`))s.redes=new Set(marcadas);
  const ag=$('mc-a-'+i.id);if(ag)s.modo=ag.checked?'agendar':'rascunho';
  return s;
}
function resumoMc(s){
  const nomes=id=>MC_REDES.find(r=>r.id===id).nome,g11=[...s.redes].filter(r=>['linkedin','twitter'].includes(r)).map(nomes),g18=[...s.redes].filter(r=>['instagram','facebook'].includes(r)).map(nomes);
  if(!g11.length&&!g18.length)return 'Nenhuma rede marcada.';
  return `${s.modo==='agendar'?'Vai ao ar':'Rascunho para'} <b>${esc(fmtDia(s.data))}</b>: ${[g11.length?`${g11.join(' e ')} às 11h`:'',g18.length?`${g18.join(' e ')} às 18h30`:''].filter(Boolean).join('; ')}.`;
}
async function enviarMetricool(i){
  const s=lerCamposMc(i),imgs=publicas(i),texto=i.legenda||i.titulo,grupos={};
  if(!mcp){s.erro='Esta visualização não tem acesso ao Metricool.';return}
  if(!s.redes.size){s.erro='Marque ao menos uma rede.';return}
  MC_REDES.filter(r=>s.redes.has(r.id)).forEach(r=>{const k=r.id==='twitter'?'x':r.hora;(grupos[k]=grupos[k]||{hora:r.hora,redes:[]}).redes.push(r.id)});
  const agora=new Date();
  for(const g of Object.values(grupos)){const [h,m]=g.hora.split(':');const [y,mo,d]=s.data.split('-');if(new Date(+y,+mo-1,+d,+h,+m)<=agora){s.erro=`O horário das ${g.hora} de ${fmtDia(s.data)} já passou. Escolha outro dia.`;return}}
  s.enviando=true;s.erro='';s.msg='';renderList();
  const feitos=[];
  try{
    for(const g of Object.values(grupos)){
      const x=g.redes.includes('twitter');
      const info={autoPublish:true,draft:s.modo==='rascunho',descendants:[],firstCommentText:'',hasNotReadNotes:false,shortener:false,smartLinkData:{ids:[]},
        text:x?(i.textoX||texto):texto,media:x?imgs.slice(0,1):imgs.slice(0,10),mediaAltText:[],
        providers:g.redes.map(n=>({network:n})),publicationDate:{dateTime:`${s.data}T${g.hora}:00`,timezone:TZ}};
      g.redes.forEach(n=>{if(n==='instagram')info.instagramData={type:'POST'};if(n==='facebook')info.facebookData={type:'POST'};if(n==='twitter')info.twitterData={tags:[]};
        if(n==='linkedin')info.linkedinData=imgs.length>1?{type:'post',publishImagesAsPDF:true,documentTitle:(i.titulo||'Licita Mais Brasil').slice(0,100),previewIncluded:true}:{type:'post',previewIncluded:true}});
      const r=await mcp.callTool(MC,'createScheduledPost',{blogId:MC_BLOG,date:`${s.data}T${g.hora}:00-03:00`,info:JSON.stringify(info)});
      const p=r&&r.payload;const url=p&&(p.plannerUrl||(Array.isArray(p)&&p[0]&&p[0].plannerUrl)||(p.data&&p.data.plannerUrl));
      feitos.push({redes:g.redes,hora:g.hora,url:url||''});
    }
  }catch(e){s.erro=msgMc(e)}
  s.enviando=false;
  if(feitos.length){
    s.msg=feitos.map(f=>`${f.redes.map(n=>MC_REDES.find(r=>r.id===n).nome).join(' e ')} às ${f.hora}: ${s.modo==='agendar'?'agendado':'rascunho criado'}${f.url?` (<a href="${esc(f.url)}" target="_blank" rel="noopener">abrir no Metricool</a>)`:''}`).join('<br>');
    try{await db.collection('itens').doc(i.id).update({dataPublicacao:s.data,metricool:{enviadoEm:new Date().toISOString(),modo:s.modo,data:s.data,redes:feitos.flatMap(f=>f.redes.map(n=>MC_REDES.find(r=>r.id===n).nome)),links:feitos.map(f=>f.url).filter(Boolean),por:me||''}})}catch(e){}
    if(!s.erro)s.aberto=false;
  }
  renderList();
}

function renderSemana(){
  const ds=diasDaSemana(),hoje=iso(new Date());
  const fim=ds[4].obj.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}),ini=ds[0].obj.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
  const opcoes=linha=>{const ord=[...pool].sort((a,b)=>(b.linha===linha)-(a.linha===linha)||(b.status==='aprovado')-(a.status==='aprovado')||(b.prioridade||0)-(a.prioridade||0));
    return ord.map(p=>`<option value="${esc(p.id)}">${p.linha===linha?'★ ':''}${p.status==='aprovado'?'[aprovado] ':''}${esc(p.titulo)}</option>`).join('')};
  $('list').innerHTML=`<div class="semana">
    <div class="kitcard"><div class="semnav"><button class="btn mini" data-act="sem-nav" data-d="-7">‹ Semana anterior</button><h3>Semana de ${ini} a ${fim}</h3><button class="btn mini" data-act="sem-nav" data-d="7">Próxima semana ›</button></div>
      <div class="crono">${CRONOGRAMA.map(c=>`<div class="lin"><b style="text-transform:capitalize">${c.nome}</b><span>${esc(c.tema)}</span></div>`).join('')}<div class="lin"><b>Horários</b><span>${esc(HORARIOS)}</span></div></div></div>
    <div class="dias5">${ds.map(d=>{const L=LINHAS[d.linha]||{cor:'#999'};const its=semanaItens.filter(i=>i.dataPublicacao===d.data);
      const corpo=its.length?its.map(i=>{const st=i.status||'pendente';const IL=LINHAS[i.linha]||L;return `
        ${(i.imagens||[]).length?`<img class="thumb" src="${esc(i.imagens[0])}" alt="Capa do post" loading="lazy">`:`<div class="thumbph" style="--c:${IL.cor}">${esc(i.titulo)}</div>`}
        <h4>${esc(i.titulo)}</h4><div class="row"><span class="pill st-${st}">${STATUS[st]}</span>${i.linha!==d.linha?`<span class="tag">${esc(IL.nome)}</span>`:''}</div>
        ${erros[i.id]?`<div class="erro">${esc(erros[i.id])}</div>`:''}
        <div class="actions">${canWrite&&st!=='aprovado'?`<button class="btn aprovar mini" data-act="aprovado" data-id="${esc(i.id)}" ${salvando.has(i.id)?'disabled':''}>Aprovar</button>`:''}<button class="btn mini" data-act="sem-ver" data-id="${esc(i.id)}">Ver prévia</button>${canWrite?`<button class="btn mini" data-act="sem-tirar" data-id="${esc(i.id)}">Tirar do dia</button>`:''}</div>`}).join('<hr style="border:0;border-top:1px solid var(--line);margin:4px 0">')
        :`<div class="vazio">Nenhum post neste dia.${canWrite&&pool.length?`<label class="lbl" for="enc-${d.data}">Encaixar sugestão</label><select id="enc-${d.data}" data-act="sem-encaixar" data-data="${d.data}"><option value="">Escolha…</option>${opcoes(d.linha)}</select>`:''}</div>`;
      return `<div class="slot ${d.data===hoje?'hoje':''}" style="--c:${L.cor}"><div class="topo"><b>${d.nome} ${d.obj.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</b><span>${esc(d.tema)}</span></div><div class="conteudo">${corpo}</div></div>`}).join('')}</div>
    ${pool.length?`<p class="note">★ marca as sugestões da linha prevista para o dia. Sugestões sem dia: ${pool.length}.</p>`:''}
  </div>`;
}
function assinarSemana(){
  unsubSemana.forEach(u=>u());unsubSemana=[];if(!db)return;
  const ds=diasDaSemana();
  unsubSemana.push(db.collection('itens').where('dataPublicacao','>=',ds[0].data).where('dataPublicacao','<=',ds[4].data).onSnapshot(s=>{semanaItens=s.docs.map(x=>({...x.data(),id:x.id}));if(dia==='semana'){renderSummary();renderList()}},e=>{$('sumText').textContent='Não foi possível carregar a semana ('+(e&&e.code||'erro')+').'}));
  unsubSemana.push(db.collection('itens').where('status','in',['pendente','aprovado']).limit(400).onSnapshot(s=>{pool=s.docs.map(x=>({...x.data(),id:x.id})).filter(i=>!i.dataPublicacao);if(dia==='semana'){renderSummary();renderList()}},()=>{}));
}
function renderAll(){renderDays();renderSummary();renderFilters();renderList()}

/* ---------- gravações ---------- */
async function gravar(id,dados,ok){
  if(!db){toast('Banco indisponível nesta visualização');return false}
  salvando.add(id);delete erros[id];renderList();
  try{await db.collection('itens').doc(id).update(dados);if(ok)toast(ok);return true}
  catch(e){erros[id]=msgErro(e);if(e&&e.code==='invalid_argument'&&!(await podeEscrever()))canWrite=false;return false}
  finally{salvando.delete(id);renderList()}
}
async function podeEscrever(){try{const u=await claude.use('user');return u?(await u.can('data.write'))!==false:true}catch(e){return true}}
const decisao=(status,extra={})=>({status,decididoEm:new Date().toISOString(),decididoPor:me||'',...extra});

document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;const id=b.dataset.id,act=b.dataset.act;
  if(act==='sem-nav'){semanaIni.setDate(semanaIni.getDate()+ +b.dataset.d);semanaIni=new Date(semanaIni);semanaItens=[];assinarSemana();renderSummary();renderList();return}
  if(act==='aj-agora'){const i=itens.find(x=>x.id===id);if(i&&sampleFn)await ajustarAgora(i);return}
  if(act==='aj-aplicar'){const i=itens.find(x=>x.id===id);if(i&&ajState[id]?.proposta)await aplicarAjuste(i);return}
  if(act==='aj-descartar'){if(ajState[id]){ajState[id].proposta=null}renderList();return}
  if(act==='mc-abrir'||act==='mc-fechar'){const i=itens.find(x=>x.id===id);if(i){const s=estadoMc(i);s.aberto=act==='mc-abrir';s.erro='';s.msg=''}renderList();return}
  if(act==='mc-enviar'){const i=itens.find(x=>x.id===id);if(i)await enviarMetricool(i);renderList();return}
  if(act==='sem-tirar'){await gravar(id,{dataPublicacao:''},'Post retirado do dia');return}
  if(act==='sem-ver'){const i=[...semanaItens,...pool].find(x=>x.id===id);if(i){irPara=id;selectDia(i.dia)}return}
  if(act==='net'){prevState[id].net=b.dataset.net;prevState[id].slide=0;renderPrev(id);return}
  if(act==='slide'){const i=itens.find(x=>x.id===id);const n=(i.imagens||[]).length;prevState[id].slide=Math.max(0,Math.min(n-1,prevState[id].slide+ +b.dataset.d));renderPrev(id);return}
  if(act==='mais'){prevState[id].aberto=!prevState[id].aberto;renderPrev(id);return}
  if(act==='copiar'){const t=$('leg-'+id);try{await navigator.clipboard.writeText(t.value);toast('Legenda copiada')}catch(e){t.focus();t.select();toast('Texto selecionado: use Ctrl+C')}return}
  if(act==='salvar'){const d={legenda:$('leg-'+id).value,editadoEm:new Date().toISOString()};const x=$('x-'+id);if(x){if([...x.value].length>280){toast('O X aceita até 280 caracteres');return}d.textoX=x.value}
    await gravar(id,d,'Textos salvos');return}
  if(act==='ajustar'){const s=ajState[id]||(ajState[id]={});s.aberto=!s.aberto;const box=$('aj-'+id);box.hidden=!s.aberto;if(s.aberto)$('cm-'+id).focus();return}
  if(act==='enviar-ajuste'){const c=$('cm-'+id).value.trim();if(!c){toast('Escreva o que precisa mudar');return}await gravar(id,decisao('ajustar',{comentario:c}),'Pedido de ajuste enviado');return}
  if(STATUS[act])await gravar(id,decisao(act,act==='pendente'?{comentario:''}:{}),'Marcado como '+STATUS[act].toLowerCase());
});
document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.dataset.mc){const i=itens.find(x=>x.id===t.dataset.id);if(!i)return;const s=lerCamposMc(i);
    if(t.dataset.mc==='modo'){renderList();return}
    const r=$('mc-resumo-'+t.dataset.id);if(r)r.innerHTML=resumoMc(s)+(s.modo==='agendar'?' O Metricool publica sozinho, sem nova confirmação.':'');
    return}
  if(t.dataset.act==='sem-encaixar'){if(t.value)await gravar(t.value,{dataPublicacao:t.dataset.data},'Post encaixado em '+fmtDia(t.dataset.data));return}
  if(t.dataset.act!=='kit'||!db)return;const rede=t.dataset.rede;delete erros['kit-'+rede];
  try{await db.collection('kit').doc(rede).set({aplicado:t.checked,em:new Date().toISOString(),por:me||''});toast(t.checked?'Rede marcada como atualizada':'Marcação removida')}
  catch(e){erros['kit-'+rede]=msgErro(e);t.checked=!t.checked;renderList()}
});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.dataset.mc==='data'){const i=itens.find(x=>x.id===t.dataset.id);if(i){const s=lerCamposMc(i);const r=$('mc-resumo-'+t.dataset.id);if(r)r.innerHTML=resumoMc(s)+(s.modo==='agendar'?' O Metricool publica sozinho, sem nova confirmação.':'')}}
  if(t.id&&t.id.startsWith('x-')){const c=document.querySelector(`.xc[data-for="${t.id}"]`);if(c){const n=[...t.value].length;c.textContent=n;c.style.color=n>280?'var(--bad-fg)':''}}
  if(t.dataset.prevFor){clearTimeout(t._p);t._p=setTimeout(()=>renderPrev(t.dataset.prevFor),250)}
});

function selectDia(d){
  dia=d;try{localStorage.setItem('pauta-dia',d)}catch(e){}
  if(unsubItens){unsubItens();unsubItens=null}itens=[];renderAll();
  if(d==='identidade'||d==='semana'||!db)return;
  unsubItens=db.collection('itens').where('dia','==',d).onSnapshot(s=>{itens=s.docs.map(x=>({...x.data(),id:x.id}));renderSummary();renderList();
    if(irPara){const el=document.getElementById('item-'+irPara);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});irPara=null}}},
    e=>{$('sumText').textContent='A conexão com a pauta caiu ('+(e&&e.code||'erro')+'). Recarregue a página.'});
}
renderAll();
(async()=>{
  db=await claude.use('db');const user=await claude.use('user');
  claude.use('mcp').then(m=>{mcp=m;if(dia&&dia!=='semana'&&dia!=='identidade')renderList()}).catch(()=>{});
  claude.use('sample').then(s=>{sampleFn=s;if(dia&&dia!=='semana'&&dia!=='identidade')renderList()}).catch(()=>{});
  if(!db){$('sumTitle').textContent='Central indisponível';$('sumText').textContent='Entre na sua conta Claude com acesso a esta página para ver e aprovar as publicações.';return}
  try{me=user?await user.id():null;const c=user?await user.can('data.write'):null;if(c===false)canWrite=false}catch(e){}
  assinarSemana();
  db.collection('kit').onSnapshot(s=>{kitDocs={};s.docs.forEach(x=>kitDocs[x.id]=x.data());if(dia==='identidade'){renderSummary();renderList()}},()=>{});
  db.collection('pautas').orderBy('id','desc').limit(30).onSnapshot(s=>{
    pautas=s.docs.map(x=>({...x.data(),id:x.id}));
    if(!dia){let saved=null;try{saved=localStorage.getItem('pauta-dia')}catch(e){}
      const firstDay=pautas.find(p=>/^\d/.test(p.id));
      const pick=(saved==='identidade'||saved==='semana'||pautas.some(p=>p.id===saved))?saved:'semana';if(pick){selectDia(pick);return}}
    renderDays();renderSummary();
  },e=>{$('sumText').textContent='Não foi possível carregar as pautas ('+(e&&e.code||'erro')+'). Recarregue a página.'});
})();
